name: Debug Daily Scraper

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to scrape (YYYY-MM-DD), e.g., 2026-07-15. Empty = yesterday.'
        required: false
        default: ''
      limit:
        description: 'Limit of messages fetched per channel'
        required: false
        default: '2'
      dry_run:
        description: 'Run in dry-run mode (do not commit to live database)'
        required: false
        default: 'true'

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
      TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
      TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
    steps:
      - name: Checkout Runner Repo
        uses: actions/checkout@v4

      - name: Verify + unseal pipeline bundle
        env:
          PIPELINE_SEAL_KEY: ${{ secrets.PIPELINE_SEAL_KEY }}
        run: |
          (cd bundles && sha256sum -c SHA256)
          python3 -m pip install --user -q cryptography
          python3 tools/unseal.py --in bundles/pipeline.seal --out /tmp/pipeline.tgz
          mkdir -p pipeline
          tar xzf /tmp/pipeline.tgz -C pipeline

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Dependencies
        working-directory: pipeline
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run Scraper
        working-directory: pipeline
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          else
            ARGS="$ARGS --yesterday"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running command: python cli.py $ARGS"
          .venv/bin/python cli.py $ARGS
