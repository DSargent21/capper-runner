name: Accuracy Gate

on:
  schedule:
    - cron: '42 6 * * 1'   # Mondays, after weekend games settle
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bundles/**'
      - '.github/workflows/**'

concurrency:
  group: accuracy-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - name: Checkout Runner Repo
        uses: actions/checkout@v4

      - name: Verify + unseal pipeline bundle
        env:
          PIPELINE_SEAL_KEY: ${{ secrets.PIPELINE_SEAL_KEY }}
        run: |
          (cd bundles && sha256sum -c SHA256)
          python3 -m pip install --user -q cryptography
          python3 tools/unseal.py --in bundles/pipeline.seal --out /tmp/pipeline.tgz
          mkdir -p pipeline
          tar xzf /tmp/pipeline.tgz -C pipeline

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        working-directory: pipeline
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run Accuracy Gate
        working-directory: pipeline
        run: python3 scripts/accuracy_gate.py

      - name: Record heartbeat
        if: always()
        working-directory: pipeline
        run: |
          python3 scripts/record_heartbeat.py --job quality-gate \
            --status "${{ job.status }}" --detail "gate run ${{ github.run_id }}"
