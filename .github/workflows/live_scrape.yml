name: Live Scraper

on:
  schedule:
    # 8 peak-aligned runs/day (plan 2026-10, D2). Times in comments = ET.
    - cron: '7 9,12,15,17,19,21 * * *'  # 05:00, 08:00, 11:00, 13:00, 15:00, 17:00
    - cron: '7 0 * * *'                  # 20:00
    - cron: '37 2 * * *'                 # 22:30
  workflow_dispatch:

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
      TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
      TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
    steps:
      - name: Checkout Runner Repo
        uses: actions/checkout@v4

      - name: Verify + unseal pipeline bundle
        env:
          PIPELINE_SEAL_KEY: ${{ secrets.PIPELINE_SEAL_KEY }}
        run: |
          (cd bundles && sha256sum -c SHA256)
          python3 -m pip install --user -q cryptography
          python3 tools/unseal.py --in bundles/pipeline.seal --out /tmp/pipeline.tgz
          mkdir -p pipeline
          tar xzf /tmp/pipeline.tgz -C pipeline

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Restore venv cache
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: pipeline/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pipeline/requirements.txt') }}

      - name: Restore pipeline state (caches + learned memory)
        uses: actions/cache@v4
        with:
          path: |
            pipeline/.vision_cache.json
            pipeline/.text_cache.json
            pipeline/.grounded_cache.json
            pipeline/.web_evidence_cache.json
            pipeline/.jina_evidence_cache.json
            pipeline/.grading_results_cache.json
            pipeline/grading_resolution_cache.json
            pipeline/grading_evidence_cache.json
            pipeline/.agent/gemini_usage.json
            pipeline/.agent/capper_variants.json
            pipeline/cache/attribution_memory.json
            pipeline/cache/pipeline_incremental.json
            pipeline/cache/quota_ledger.json
            pipeline/cache/dead_letter.json
            pipeline/cache/heartbeat.json
          key: pipeline-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pipeline-state-${{ runner.os }}-

      - name: Install Dependencies
        working-directory: pipeline
        run: |
          if [ ! -f .venv/bin/python ] || ! .venv/bin/python -c "import sys" 2>/dev/null; then
            echo "Virtual environment missing or broken, rebuilding..."
            rm -rf .venv
            python -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
          fi

      - name: Replay dead-letter uploads
        continue-on-error: true
        working-directory: pipeline
        run: .venv/bin/python scripts/replay_dead_letter.py || true

      - name: Quota governor (mode gate)
        id: gov
        working-directory: pipeline
        run: .venv/bin/python scripts/quota_governor.py decide --job live

      - name: Validate capper mappings (pre-flight)
        # Best-effort on the live path: a transient Supabase hiccup must never
        # stop collection (the daily run owns repairs, and upload quarantines
        # dead rows). A REAL stale mapping is logged here before any fetch so
        # the FK failure never eats a chunk of otherwise-good picks.
        continue-on-error: true
        working-directory: pipeline
        run: |
          .venv/bin/python scripts/repair_capper_directory.py --check-only \
            || echo "pre-flight warning: capper map could not be verified - continuing (upload quarantines dead rows)."

      - name: Run Live Scraper
        if: steps.gov.outputs.run == 'true'
        working-directory: pipeline
        run: .venv/bin/python cli.py --live --source all --incremental

      - name: Check recovery artifact files
        id: artifact-check
        if: always()
        run: |
          # Actions bills an upload step even when it finds nothing; live runs
          # 8x/day, so gate both uploads on file existence.
          has_quarantine=false
          has_state=false
          if [ -f pipeline/cache/quarantined_picks.json ] || [ -f pipeline/cache/failed_uploads.json ]; then
            has_quarantine=true
          fi
          if [ -f pipeline/cache/attribution_memory.json ] || [ -f pipeline/.agent/capper_variants.json ]; then
            has_state=true
          fi
          echo "has_quarantine=$has_quarantine" >> "$GITHUB_OUTPUT"
          echo "has_state=$has_state" >> "$GITHUB_OUTPUT"

      - name: Upload quarantined/fallback picks (durable recovery)
        # The runner is ephemeral: without this, rows whose capper_id is dead
        # at upload time vanish with the job instead of being re-filed after
        # the map is repaired.
        if: always() && steps.artifact-check.outputs.has_quarantine == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quarantined-picks-${{ github.run_id }}
          path: |
            pipeline/cache/quarantined_picks.json
            pipeline/cache/failed_uploads.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload learned attribution state (durable recovery)
        if: always() && steps.artifact-check.outputs.has_state == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: learned-state-${{ github.run_id }}
          path: |
            pipeline/cache/attribution_memory.json
            pipeline/.agent/capper_variants.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Record heartbeat
        if: always()
        working-directory: pipeline
        run: |
          .venv/bin/python scripts/record_heartbeat.py --job live-scrape \
            --status "${{ job.status }}" --detail "live run ${{ github.run_id }}"
