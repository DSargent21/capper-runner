name: Seal Recipient

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Derive recipient public key
        env:
          PIPELINE_SEAL_KEY: ${{ secrets.PIPELINE_SEAL_KEY }}
        run: |
          python3 -m pip install --user -q cryptography
          python3 - <<'PY'
          import base64
          import os
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey

          key = os.environ.get("PIPELINE_SEAL_KEY", "").strip()
          if not key:
              raise SystemExit("missing PIPELINE_SEAL_KEY")
          raw = base64.urlsafe_b64decode(key.encode())
          if len(raw) != 32:
              raise SystemExit(f"unexpected private key length: {len(raw)}")
          public = X25519PrivateKey.from_private_bytes(raw).public_key().public_bytes_raw()
          print("RECIPIENT_PUBLIC=" + base64.urlsafe_b64encode(public).decode())
          PY
