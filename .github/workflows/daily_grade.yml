name: Daily Grader

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 7:00 AM EDT; grades the 08:00 scrape
  workflow_dispatch:
    inputs:
      drain:
        description: 'Drain entire backlog oldest-first (one-time cleanup). Re-run until clear.'
        type: boolean
        default: false
      max_dates:
        description: 'Max dates to process this run (0 = unlimited). Used with drain.'
        type: number
        default: 0
      chain:
        description: 'Internal autopilot counter: how many drain runs have chained so far (0 = manual).'
        type: number
        default: 0

concurrency:
  group: grader
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write   # drain autopilot: dispatch the next chained run
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GRADER_WAIT_BUDGET_S: "900"
    steps:
      - name: Checkout Runner Repo
        uses: actions/checkout@v4

      - name: Verify + unseal pipeline bundle
        env:
          PIPELINE_SEAL_KEY: ${{ secrets.PIPELINE_SEAL_KEY }}
        run: |
          (cd bundles && sha256sum -c SHA256)
          python3 -m pip install --user -q cryptography
          python3 tools/unseal.py --in bundles/pipeline.seal --out /tmp/pipeline.tgz
          mkdir -p pipeline
          tar xzf /tmp/pipeline.tgz -C pipeline

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Restore venv cache
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: pipeline/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('pipeline/requirements.txt') }}

      - name: Install Dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        working-directory: pipeline
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run Daily Grader
        working-directory: pipeline
        run: |
          ARGS="--yesterday --review --review-window 3"
          if [ "${{ github.event.inputs.drain }}" = "true" ]; then
            # --budget 4800: self-stop at 80 min, inside the 90-min job
            # timeout. A hard kill mid-date loses that date's graded batch
            # (update_grade_status commits per date); a budget stop finishes
            # the date, writes, and leaves the rest for the next dispatch.
            ARGS="--drain --budget 4800"
            MAXD="${{ github.event.inputs.max_dates }}"
            if [ "$MAXD" != "0" ] && [ -n "$MAXD" ]; then
              ARGS="$ARGS --max-dates $MAXD"
            fi
          fi
          .venv/bin/python scripts/grade_pending.py $ARGS | tee grade_output.txt

      - name: Drain autopilot — chain the next run while the backlog survives
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.drain == 'true' }}
        working-directory: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CHAIN: ${{ github.event.inputs.chain }}
        run: |
          # A backlog this size is hours of free-minutes grading, not one run.
          # Keep the chain alive while real progress is still being made, and
          # stop on: empty backlog (count excludes TODAY — live-day picks are
          # legitimately pending until tomorrow), a run that moved almost
          # nothing (upstream quota walls; hammering re-pays 429s for nothing),
          # or a 24-link depth cap (~30h worst case).
          MOVED=$(grep -oE 'Graded: [0-9]+ \| Sent to needs_review: [0-9]+' grade_output.txt | tail -1 | grep -oE '[0-9]+' | paste -sd+ | bc 2>/dev/null || echo 0)
          [ -z "$MOVED" ] && MOVED=0
          DEPTH=${CHAIN:-0}
          TODAY=$(date -u +%F)
          CNT=$(curl -s -G "$SUPABASE_URL/rest/v1/picks" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Prefer: count=exact" --data-urlencode "select=id" --data-urlencode "status=eq.pending_grading" --data-urlencode "pick_date=lt.$TODAY" -o /dev/null -D - | tr -d '\r' | awk -F'/ ' '/[Cc]ontent-[Rr]ange/ {print $2}')
          case "$CNT" in ''|*[!0-9]*) CNT=0;; esac
          echo "moved=$MOVED pending_before_today=$CNT chain_depth=$DEPTH"
          if [ "$CNT" -gt 0 ] && [ "$MOVED" -ge 25 ] && [ "$DEPTH" -lt 24 ]; then
            gh workflow run "Daily Grader" -R "$GITHUB_REPOSITORY" -f drain=true -f max_dates=0 -f chain=$((DEPTH+1))
            echo "✅ queued next drain (chain $((DEPTH+1))/24): $CNT picks remain"
          else
            echo "🛑 drain chain stops here (backlog $CNT, moved $MOVED, depth $DEPTH)"
          fi

      - name: Golden canary (deterministic drift check)
        if: always()
        continue-on-error: true
        working-directory: pipeline
        run: |
          .venv/bin/python -c "import pytest" 2>/dev/null || \
            .venv/bin/pip install -q pytest
          .venv/bin/python -m pytest -m golden_canary -q tests/ || \
            echo "::warning::golden canary drift — verify today's grades before trusting them"

      - name: Record heartbeat
        if: always()
        working-directory: pipeline
        run: |
          .venv/bin/python scripts/record_heartbeat.py --job daily-grade \
            --status "${{ job.status }}" --detail "grade run ${{ github.run_id }}"
